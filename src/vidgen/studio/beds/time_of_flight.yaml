# Time of Flight: a score-file template of schu-video-generator's built-in bed `time_of_flight` (vidgen music template time_of_flight).
# This file IS the bed, not a re-creation: `music: time_of_flight` plays this score rendered by
# schu-video-generator, sample for sample. A tech-documentary loop in B minor at 108 BPM: a dark pad, an
# FM-pluck arpeggio behind a closed filter and satellite "pings" in the intro; kick, off-beat bass
# and hats in the build while the pad and the arpeggio open, a riser into the lift; in the lift
# the pad wide open, a clap on 2 and 4 and a soft lead; the settle closes back to the top.
# Made by an AI author from the `momentum` template by the author guide's "Making music" recipe,
# one change at a time with `vidgen music check` after each (the log: examples/gps-time-of-flight).
# What it kept from the template: a pumping pad, a kick on every beat, the off-beat bass, hats.
# Copy it under a new name and change one thing at a time; check each change:
#   vidgen music check my_theme.yaml --compare time_of_flight.yaml --out build/music-check
version: 1
title: Time of Flight
description: Tech-documentary loop in B minor at 108 BPM - a quiet intro with satellite pings, a build that opens an arpeggio's filter, a lift with a soft lead, a settle that loops back.
key: B minor
tempo: 108
seed: 1
chord_bars: 2                        # a chord every two bars (4.4 s)
progression: "i(add9) v7 VImaj7 iv9"  # Bm(add9) F#m7 Gmaj7 Em9: dark, unresolved, moving forward
sections:
  - {name: intro, bars: 4}           # pad, arpeggio (filtered), pings: room for the first lines
  - {name: build, bars: 8}           # kick, bass and hats enter; the pad and arpeggio open; a riser at the end
  - {name: lift, bars: 8, progression: "VImaj7 VII i(add9) III"}   # Gmaj7 A Bm(add9) D: brighter, the lead plays
  - {name: settle, bars: 4, progression: "VImaj7 Vsus4"}          # Gmaj7 F#sus4: back down, leading to the top
master: {lowpass: 4500}              # the beds' gentle final roll-off
tracks:
  # The warm pad: quieter and darker in the intro, opening through the build, open in the lift,
  # closing in the settle (it ends where the intro starts, so the loop is seamless).
  pad:
    instrument: pad
    play: chords
    settings: {tone: 2600, air: 0.3, swell: 12, sub: 0.55}
    volume: -3
    duck: {to: beat, depth: 0.45, release: 0.14}
    lowpass: 1200
    sections:
      build: {volume: {from: -3, to: 0}, lowpass: {from: 1200, to: 2600}}
      lift: {volume: 1.5, lowpass: none}
      settle: {volume: {from: 0, to: -3}, lowpass: {from: 2600, to: 1200}}
  kick:
    instrument: kick
    settings: {high: 100, low: 50, decay: 0.14, click: 0.08}
    steps: "x... x... x... x..."
    rest: [intro]
  clap:
    instrument: clap
    steps: "....x.......x..."        # beats 2 and 4, in the lift only
    only: [lift]
  hat:
    instrument: hat
    steps: "ooXo ooXo ooXo ooXo"
    spread: 0.25
    only: [build, lift]
  # The arpeggio: chord tones in sixteenths, accented 4+4+2+3+3, its low-pass opening from 700 Hz
  # to 3 kHz over the build (the main sign that something is coming).
  arp:
    instrument: fm_pluck
    octave: 3
    steps: "1 5 8 5 3' 8 5 8 1 5 8 9 8 5 3' 5"
    accent: "4+4+2+3+3"
    volume: -2
    spread: 0.2
    settings: {decay: 0.12, index: 1.2, ring: 0.2}
    lowpass: 700
    sections:
      build: {lowpass: [[0, 700], [8, 3000]]}
      lift: {lowpass: 3200}
      settle: {lowpass: {from: 3200, to: 700}}
  bass:
    instrument: synth_bass
    steps: ".x.x.x.x"
    settings: {decay: 0.1, tone: 550, ring: 0}
    rest: [intro]
  # A high "ping" (4.8 kHz, above the voice's range) with echoes: the satellites' signals.
  ping:
    instrument: tick
    only: [intro, settle]
    settings: {tone: 4800}
    volume: 8
    steps: "X... .... .... .... | .... .... x.x. ...."
    echo: {delay: 0.75, feedback: 0.4, repeats: 3}
  # The lift's tune: long notes, one or two a bar, soft and with a hall around it.
  lead:
    instrument: soft_lead
    only: [lift]
    volume: 3
    settings: {attack: 0.08, vibrato: 10, tone: 2200, ring: 0.6}
    reverb: {size: 2.6, mix: 0.3}
    steps: "F#5 - - - . . D5 - | E5 - - - - - . . | C#5 - - - E5 - - - | A5 - - - - - . . | B5 - - - F#5 - - - | D6 - - - C#6 - B5 - | A5 - - - F#5 - - - | E5 - - - - - . ."
  riser:
    instrument: riser
    only: [build]
    steps: ". | . | . | . | . | . | x | -"   # the build's last two bars
    volume: -1.3

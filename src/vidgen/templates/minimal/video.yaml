# schu-video-generator project config (command: vidgen). Reference: docs/CONFIG.md
# How to make a good video (workflow, pacing, scene types): `vidgen guide` (AGENTS.md)
title: __TITLE__
# output: my_video          # basename of the output files; default: the folder name

format: {width: 1920, height: 1080, fps: 30}
preview: {width: 854, height: 480, fps: 15}

# variants:                 # named overrides, deep-merged onto this config
#   vertical:
#     format: {width: 1080, height: 1920}
#     preview: {width: 480, height: 854}

theme:
  preset: dark_tech               # `vidgen list-themes` shows all (light_academic, warm_editorial, ...)
  # scale: auto                   # type sizes: compact, standard, large; auto = large in vertical video
  font: Inter
  # colors: {accent: "#FF6B6B"}   # override or add color tokens

voice:
  provider: elevenlabs
  voice_id: nPczCjzI2devNBz1zQrb
  model_id: eleven_multilingual_v2

narration:
  pad: 0.35                 # seconds of silence after each beat

scenes:                     # scene types: `vidgen list-scenes`; reference: docs/CONFIG.md
  - id: intro
    type: title
    params:
      kicker: "MADE WITH VIDGEN"
      title: __TITLE__
      subtitle: "A narrated video from a single config file"
    beats:
      - text: "Welcome. This short video was generated from a single config file."

  - id: points
    type: bullets
    params:
      heading: "How it works"
      numbered: true
      items:
        - "Write the narration as beats"
        - "Pick a scene type for each scene"
        - "Run vidgen tts, then vidgen render"
    beats:
      - text: "First, write what the narrator says, split into short beats."
      - text: "Then give each scene a type, such as a title, a list or a chart."
      - text: "Generate the voice once, then render. Only changed beats are re-voiced."

  - id: outro
    type: end_card
    params:
      title: "Your turn"
      lines: ["Edit video.yaml and run vidgen render --preview"]
    beats:
      - text: "Now edit the config, and make it your own."

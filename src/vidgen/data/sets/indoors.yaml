# Built-in indoor sets (DESIGN.md §77): rooms with a door, windows, furniture, the indoor light and a
# room tone. A stage scene uses one with set: NAME when the project's own sets: has no set of that
# name; its params override the set's as for any set (CONFIG "Ready-made sets"). Every set leaves
# two marks clear for two characters at depth 0: stand_left and stand_right. The furniture against
# the wall stands at the wall's depth (0.4): a character walks there (depth 0.4) to sit or lean.
sets:
  classroom:                     # a blackboard, the teacher's desk, two pupils' desks facing the board
    light: indoor
    ambience: room_tone
    room:
      wall: "#DCE6D3"
      flooring: boards
      windows: [{at: 0.12, sill: 0.55, curtains: false}]
      doors: [{at: 0.9}]
    marks: {stand_left: 0.27, stand_right: 0.69, blackboard: 0.47, teacher: 0.12, pupil: 0.6, pupil_2: 0.8}
    props:
      - {prop: blackboard, at: blackboard}
      - {prop: desk, at: teacher, against: wall}
      - {prop: school_desk, at: pupil, depth: 0.25, facing: left}
      - {prop: school_desk, at: pupil_2, depth: 0.25, facing: left}

  kitchen:                       # a fridge, a counter with a kettle on it, a table with two chairs
    light: indoor
    ambience: room_tone
    room:
      wall: "#F3E7CE"
      wallpaper: stripes
      flooring: tiles
      windows: [{at: 0.52, sill: 0.5}]
      doors: [{at: 0.9}]
    marks: {stand_left: 0.27, stand_right: 0.73, counter: 0.3, table: 0.5, chair: 0.395, chair_2: 0.605}
    props:
      - {prop: fridge, at: 0.08, against: wall}
      - {prop: counter, at: counter, against: wall}
      - {prop: kettle, at: 0.34, depth: 0.4, lift: 0.18}
      - {prop: clock, at: 0.38}
      - {prop: table, at: table, depth: 0.2}
      - {prop: chair, at: chair, depth: 0.2}
      - {prop: chair, at: chair_2, depth: 0.2, facing: left}

  shop:                          # shelves with goods at the wall, a counter with a till in front
    light: indoor
    ambience: room_tone
    room:
      wall: "#E2EBF1"
      flooring: tiles
      ceiling: true
      windows: [{at: 0.14, width: 0.9, sill: 0.3, curtains: false}]
      doors: [{at: 0.9}]
    marks: {stand_left: 0.27, stand_right: 0.8, counter: 0.55, behind_counter: 0.5}
    props:
      - {prop: shelf_with_goods, at: 0.44, against: wall}
      - {prop: shelf_with_goods, at: 0.64, against: wall}
      - {prop: counter, at: counter, depth: 0.2, color: secondary, detail: primary}
      - {prop: till, at: 0.62, depth: 0.2, lift: 0.2}

  living_room:                   # a lamp, a sofa under a picture, a tv under the window, an armchair, a rug
    light: indoor
    ambience: room_tone
    room:
      wallpaper: stripes
      flooring: boards
      windows: [{at: 0.8, sill: 0.62}]
      doors: [{at: 0.52}]
    marks: {stand_left: 0.38, stand_right: 0.66, sofa: 0.21, tv: 0.8, armchair: 0.93}
    props:
      - {prop: lamp, at: 0.07, depth: 0.4, scale: 0.6, "on": true}
      - {prop: sofa, at: sofa, against: wall}
      - {prop: picture, at: sofa}
      - {prop: tv, at: tv, against: wall}
      - {prop: armchair, at: armchair, depth: 0.25}
      - {prop: rug, at: 0.5, depth: 0.15}

  bedroom:                       # a bedside lamp, a bed under a window with curtains, a wardrobe
    light: indoor
    ambience: room_tone
    room:
      wall: "#E6E0F0"
      wallpaper: dots
      flooring: boards
      windows: [{at: 0.24, sill: 0.5, curtains: primary}]
      doors: [{at: 0.56}]
    marks: {stand_left: 0.42, stand_right: 0.72, bed: 0.24, wardrobe: 0.86}
    props:
      - {prop: lamp, at: 0.05, depth: 0.4, scale: 0.5, "on": true}
      - {prop: bed, at: bed, against: wall}
      - {prop: wardrobe, at: wardrobe, against: wall}
      - {prop: rug, at: 0.5, depth: 0.1, color: primary}

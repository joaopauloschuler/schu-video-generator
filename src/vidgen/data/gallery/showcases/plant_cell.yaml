title: Inside a Plant Cell
voice: {provider: kokoro, voice: af_heart}
scenes:
  - id: plant_cell
    type: cell
    params:
      title: "A plant cell"
      cell: plant                        # a wall, plasmodesmata, the central vacuole, chloroplasts

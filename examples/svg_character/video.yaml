# An imported SVG character (DESIGN.md §69.2, docs/CONFIG.md "Characters"): assets/sprout.svg is
# split into parts by its element ids (body, legs, arm_left, arm_right, head, eyes, brows, mouth;
# eyes_closed and mouth_A / _E / _O / _M are other shapes), pivots from data-pivot="x y".
#   vidgen validate examples/svg_character                  # lists the actions sprout cannot do
#   vidgen character sprout examples/svg_character --png    # one still: exports/character_sprout.png
#   vidgen character pebble examples/svg_character --png    # a generated character, for comparison
# No scene type draws characters yet (the stage scene comes later), so the video is one card.
title: "An SVG character"
output: svg_character

format: {width: 1920, height: 1080, fps: 30}
preview: {width: 854, height: 480, fps: 15}

characters:
  - name: sprout
    look: {svg: assets/sprout.svg}   # under assets/, so editing the file re-renders scenes
  - name: pebble
    look: {body: round, eyes: round, hair: short, seed: 4}

scenes:
  - id: note
    type: text_card
    params:
      text: "Characters can be drawn from your own SVG files"
    beats:
      - text: "Characters can be drawn from your own SVG files, split into parts by their names."

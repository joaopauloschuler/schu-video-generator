    text: Feito com Manim, ElevenLabs e ffmpeg
  scenes.intro.params.highlight:
    source: single config file
    hash: 8e0b550196
    text: um só arquivo de configuração
  scenes.intro.beats.intro_b1.text:
    source: This whole video comes from one config file, with no Python code at all.
    hash: 08bb27bb38
    text: Este vídeo inteiro vem de um único arquivo de configuração, sem nenhuma linha de código Python.
  scenes.intro.beats.intro_b2.text:
    source: Every scene you are about to see is a built-in scene type.
    hash: 944e16ea97
    text: Cada cena que você vai ver é um tipo de cena pronto.
  scenes.steps.params.heading:
    source: How a video is made
    hash: 3a91029852
    text: Como um vídeo é feito
  scenes.steps.params.items[0].text:
    source: Write the narration as short beats
    hash: f2133b50f0
    text: Escreva a narração em trechos curtos
  scenes.steps.params.items[1].text:
    source: Pick a scene type and its parameters for each scene
    hash: eb8cd49cec
    text: Escolha o tipo e os parâmetros de cada cena
  scenes.steps.params.items[2].text:
    source: Generate the voice once; only edited beats are re-voiced
    hash: 3081e2736a
    text: Gere a voz uma vez; só trechos editados são regravados
  scenes.steps.params.items[3].text:
    source: Render a preview, then the final video with subtitles
    hash: 0057601b08
    text: Renderize uma prévia, depois o vídeo final legendado
  scenes.steps.beats.steps_b1.text:
    source: First, you write the narration as a list of short beats.
    hash: 41b1643dbb
    text: Primeiro, você escreve a narração como uma lista de trechos curtos.
  scenes.steps.beats.steps_b2.text:
    source: Each scene gets a type, like a title, a chart or a code listing.
    hash: 5bab6cd983
    text: Cada cena ganha um tipo, como um título, um gráfico ou uma listagem de código.
  scenes.steps.beats.steps_b3.text:
    source: The voice is generated once, and only edited beats are paid for again.
    hash: 06b1110f73
    text: A voz é gerada uma vez, e só os trechos editados são pagos de novo.
  scenes.steps.beats.steps_b4.text:
    source: Then you render a quick preview, and finally the full video.
    hash: cf9e1b6d8e
    text: Depois você renderiza uma prévia rápida e, por fim, o vídeo completo.
  scenes.feedback.params.items[0].label:

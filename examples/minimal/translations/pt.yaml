  scenes.sizes.beats.sizes_b2.text:
    source: 'Beats can point at single bars: four K takes by far the longest.'
    hash: 6c50d70d91
    text: 'Um trecho pode apontar uma barra: o quatro K é o mais demorado.'
  scenes.sizes.beats.sizes_b3.text:
    source: And previews are the fast way to iterate.
    hash: 6272ce8c3d

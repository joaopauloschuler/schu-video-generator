    text: Retorno enquanto você escreve
  scenes.feedback.beats.feedback_b1.text:
    source: Icon grids reveal one item per beat. A storyboard shows every beat at a glance.
    hash: a2e121fb82
    text: Grades de ícones revelam um item por trecho. Um storyboard mostra cada trecho num relance.
  scenes.feedback.beats.feedback_b2.text:
    source: Lint checks the layout and the timing for you.
    hash: 542ed38125
    text: O lint confere o layout e o ritmo para você.
  scenes.feedback.beats.feedback_b3.text:
    source: Every command can also answer in JSON, for scripts and agents.
    hash: d6d8c6a4a6
    text: Todo comando também pode responder em JSON, para scripts e agentes.
  scenes.feedback.beats.feedback_b4.text:
    source: And a theme preset restyles the whole video.
    hash: a22df7970a
    text: E um tema pronto muda o visual do vídeo inteiro.
  scenes.feedback.beats.feedback_b5.text:
    source: At the end, one item can be highlighted, like lint here.
    hash: 7e40e9055c
    text: No fim, um item pode ser destacado, como o lint aqui.

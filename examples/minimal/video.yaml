# A config-only vidgen project: the core built-in scene types, no extensions.
# The newer scene types (stat, chapter, comparison, table, timeline, diagram, process, network,
# scatter, histogram, pie, heatmap, map, screenshot, video_clip, equation_derivation,
# code_walkthrough) are shown in examples/gallery.
#   vidgen validate examples/minimal
#   vidgen render examples/minimal --preview                     # 16:9
#   vidgen render examples/minimal --preview --variant vertical  # 9:16
#   vidgen validate examples/minimal --json                      # machine-readable report
#   vidgen render examples/minimal --preview --frames            # + a PNG at the end of each beat
#   vidgen storyboard examples/minimal [--variant vertical]      # contact sheets of every beat (PNG)
#   vidgen lint examples/minimal [--variant vertical]            # layout + timing checks (dead air, ...)
#   vidgen storyboard examples/minimal --scene sizes --per-beat 3   # mid-beat stills: beat actions
#   vidgen storyboard examples/minimal --scene math --per-beat 3    # transform and zoom actions
#   vidgen storyboard examples/minimal --scene trend --per-beat 3   # a callout action
#   vidgen storyboard examples/minimal --variant light           # same video with the light_academic preset
#   vidgen storyboard examples/minimal --variant subtitled       # burned-in captions (SRT-style cues)
#   vidgen storyboard examples/minimal --variant social --per-beat 3   # 9:16 karaoke captions
#   vidgen list-themes examples/minimal --swatches build/themes.png  # every theme preset at a glance
# There is no narration audio in this example, so beats are timed from their word count
# (narration.words_per_second); run `vidgen tts` with an ElevenLabs key to voice it.
title: "vidgen: the built-in scenes"
output: minimal

format: {width: 1920, height: 1080, fps: 30}
preview: {width: 854, height: 480, fps: 15}

variants:
  vertical:
    format: {width: 1080, height: 1920}
    preview: {width: 480, height: 854}
  light:                          # a theme preset per variant (docs/CONFIG.md "Theme presets")
    theme: {preset: light_academic}
  contrast:
    theme: {preset: high_contrast}  # also the large type scale
  editorial:
    theme: {preset: warm_editorial}
  neutral:
    theme: {preset: brand_neutral, scale: compact}   # any preset with another type scale
  pastel:
    theme: {preset: soft_pastel}
  neon:
    theme: {preset: bold_neon}
  subtitled:                      # the narration burned in as captions (docs/CONFIG.md "captions")
    overlays: [{type: captions}]
  social:                         # 9:16 for social apps: karaoke captions, the spoken word highlighted
    format: {width: 1080, height: 1920}
    preview: {width: 480, height: 854}
    overlays: [{type: captions, style: karaoke}]

theme:
  preset: dark_tech   # the default look; values written here would override every variant's preset
  font: Inter

narration:
  pad: 0.35
  words_per_second: 2.6

pronunciation:        # how the narrator says terms: only the text sent to the TTS changes,
  LaTeX: lah-tek      # subtitles and captions keep the written words (docs/CONFIG.md "Pronunciation")
  JSON: jay-son       # `vidgen tts examples/minimal --dry-run` shows what each beat says

lint:                 # optional; thresholds and severities of `vidgen lint` (docs/CONFIG.md)
  fail_on: error      # warnings are reported, only errors make the command fail

scenes:
  - id: intro
    type: title
    params:
      kicker: "VIDGEN EXAMPLE"
      title: "Narrated videos from a single config file"
      highlight: "single config file"
      subtitle: "A tour of the built-in scene types"
      authors: ["Made with Manim, ElevenLabs and ffmpeg"]
    beats:
      - text: "This whole video comes from one config file, with no Python code at all."
      - text: "Every scene you are about to see is a built-in scene type."

  - id: steps
    type: bullets
    params:
      heading: "How a video is made"
      numbered: true
      dim_previous: true
      items:              # plain strings, or {text, icon} (icons: docs/ICONS.md, `vidgen list-icons`)
        - {text: "Write the narration as short beats", icon: pencil}
        - {text: "Pick a scene type and its parameters for each scene", icon: shapes}
        - {text: "Generate the voice once; only edited beats are re-voiced", icon: megaphone}
        - {text: "Render a preview, then the final video with subtitles", icon: play}
    beats:
      - text: "First, you write the narration as a list of short beats."
      - text: "Each scene gets a type, like a title, a chart or a code listing."
      - text: "The voice is generated once, and only edited beats are paid for again."
      - text: "Then you render a quick preview, and finally the full video."

  - id: feedback
    type: icon_grid
    params:
      heading: "Feedback while you write"
      icon_color: palette
      highlight: "Lint"
      items:
        - {icon: presentation, label: "Storyboard", sublabel: "every beat at a glance"}
        - {icon: shield-check, label: "Lint", sublabel: "layout and timing checks"}
        - {icon: file-text, label: "JSON output", sublabel: "for scripts and agents"}
        - {icon: palette, label: "Theme presets", sublabel: "one line restyles it all"}
    beats:
      - text: "Icon grids reveal one item per beat. A storyboard shows every beat at a glance."
      - text: "Lint checks the layout and the timing for you."
      - text: "Every command can also answer in JSON, for scripts and agents."
      - text: "And a theme preset restyles the whole video."
      - text: "At the end, one item can be highlighted, like lint here."

  - id: sizes
    type: bar_chart
    params:
      title: "Render time per minute of video"
      labels: ["Preview 480p", "720p", "1080p", "4K"]
      values: [0.4, 1.1, 2.6, 9.8]
      unit: " min"
      colors: palette
      caption: "Illustrative numbers"
    beats:
      - text: "Bar charts grow their bars while the values count up."
      - text: "Beats can point at single bars: four K takes by far the longest."
        actions:          # per-beat actions on the scene's targets (docs/CONFIG.md "Beat actions")
          - {action: highlight, target: "bar:4K", style: box, until: sizes_b3}
      - text: "And previews are the fast way to iterate."
        actions:          # shorthand form: {ACTION: TARGET, ...options}
          - dim: [bar2, bar3, bar4]
          - highlight: "bar:Preview 480p"

  - id: trend
    type: line_chart
    params:
      title: "Validation loss"
      x: [1, 2, 3, 4, 5, 6, 7, 8]
      x_label: "epoch"
      y_label: "loss"
      series:
        baseline: [2.10, 1.82, 1.66, 1.58, 1.53, 1.50, 1.49, 1.48]
        sparse: [2.25, 1.90, 1.68, 1.56, 1.49, 1.45, 1.43, 1.41]
    beats:
      - text: "Line charts draw one series per beat. Here is the baseline."
      - text: "And here is the sparse model, which ends lower."
        actions:          # a callout on any scene: a target, or an area of the frame (docs/CONFIG.md)
          - callout: "point:sparse@8"
            kind: arrow
            label: "Lowest loss"
            at: 0.4

  - id: picture
    type: image
    params:
      path: assets/landscape.png
      caption: "Images can slowly zoom and pan"
      fit: cover
      ken_burns: {start_scale: 1.0, end_scale: 1.2, start_focus: [0.5, 0.5], end_focus: [0.7, 0.35]}
    beats:
      - text: "Images come from the project's assets folder."
      - text: "With a gentle zoom and pan, still pictures feel alive."

  - id: saying
    type: quote
    params:
      text: "Simplicity is prerequisite for reliability."
      author: "Edsger W. Dijkstra"
      source: "How do we tell truths that might hurt? (1975)"
    beats:
      - text: "Quotes get large typographic marks."
      - text: "And an attribution underneath."

  - id: math
    type: equation
    params:
      latex:
        - "(a + b)^2"
        - "(a + b)(a + b)"
        - "a^2 + 2ab + b^2"
      caption: "Each step morphs into the next"
      terms: ["2ab"]      # a part of the formulas that beat actions can target: term:2ab
    beats:
      - text: "Equations are typeset with LaTeX."
      - text: "Each step transforms into the next one, and an action can even jump ahead."
        actions:          # morph step 2 into step 3 a beat early; beat 3 then keeps it
          - {transform: step2, into: step3, at: 0.6}
      - text: "Here is the expanded form, and a closer look at its middle term."
        actions:          # the camera moves in on the term and is back by the end of the beat
          - {zoom: "term:2ab", at: 0.3}

  - id: listing
    type: code
    params:
      title: "Code with highlights"
      path: assets/moving_average.py
      highlight: ["1", "3-5", "6-8"]
    beats:
      - text: "Code listings are syntax highlighted, and the narration can point at lines."
      - text: "First we sum the opening window."
      - text: "Then we slide it along, one value at a time."

  - id: note
    type: text_card
    params:
      text: "Need something else? Add a scene type in extensions/"
      size: heading
    beats:
      - text: "And when a built-in is not enough, a project can add its own scene types."

  - id: outro
    type: end_card
    params:
      title: "Thanks for watching"
      lines: ["Built-in scenes: docs/CONFIG.md", "Your own scenes: docs/EXTENDING.md"]
    beats:
      - text: "Thanks for watching."
      - text: "The config reference and the extension guide are in the docs folder."

    steps: "D3 | F3 - E3 - | D3 | F3 - G3 - | G3 | Bb3 - A3 - | A3 | G3 - E3 -"
    sections:
      dial: {volume: {from: -8, to: -5}, settings: {tone: 1200, attack: 0.5, release: 1.4, detune: 12}}
      movement: {volume: [[0, -6], [16, -2]]}
      orrery: {steps: "F3 | - | A3 | C4 - A3 - | Bb3 | D4 - Bb3 - | A3 | F3 - E3 - | D3 | F3 | E3 | -", volume: -6, settings: {tone: 1500, attack: 0.5, release: 1.4, detune: 12}}
      climax: {steps: "D3 | F3 - E3 - | D3 | F3 - G3 - | G3 | Bb3 - A3 - | A3 | G3 - E3 - | D3 | F3 - A3 - | Bb3 | D4 - Bb3 - | C4 | E4 - G4 - | F#4 | A4 - - -", volume: 0, settings: {tone: 2000, attack: 0.12, release: 0.7, detune: 16}}
      coda: {steps: "F#3 | A3 | G3 | Bb3 | A3 | F#3 | D3 | -", volume: [[0, -4], [6, -5], [8, -14]], settings: {tone: 1300, attack: 0.5, release: 2.2, detune: 12}}
  # ------------------------------------------------------------------ bells
  chime:              # the hour struck: deep bell tones in a long hall
    instrument: bell

      cathedral: {steps: "D4+D5 | . | . | . | G3+G4 | . | A3+A4 | . | D4+D5 | . | Bb3+Bb4 | . | G3+G4 | . | A3+A4 | D4+D5", volume: 4}
      orrery: {steps: "Bb3+F4 | . | . | . | G3+D4 | . | . | . | . | . | . | .", volume: 1}
      climax: {steps: "D4+D5 | . | Bb3+Bb4 | . | G3+G4 | . | A3+A4 | . | D4+D5 | . | Bb3+Bb4 | . | C4+C5 | . | D4+D5+A5 | D4+D5+F#5", volume: 5}
      coda: {steps: ". | . | . | . | D4+A4 | D4+A4 | D4+A4 | D4+A4+F#5", volume: {from: 4, to: 3}}
  twinkle:            # music-box glints on chord tones: jewels catching the light
    instrument: music_box

# Escapement: an original score for a clockwork film, played by vidgen's own synthesizer
# (no samples, no SoundFont, no audio files).
#
# 120 BPM in D minor. One beat is exactly 15 video frames at 30 fps and one bar exactly 60 frames
# (2 seconds), so the clock's tick IS the beat: tick on 1 and 3, tock on 2 and 4, two ticks a second.
#
# The theme (16 bars, two phrases) climbs by fourths: A-D-F-E, D-F-A-G, G-Bb-D-C, A-G-E-C#; the answer
# falls home: D-E-F-A, G-F-D, Bb-D-G-F, E-C#-D. It is stated simply by a music box over the dial,
# sung by a horn in the movement, played in full by brass among the great gears, heard far away among
# the planets, and returns transformed at the climax: an octave higher, over C and D major instead of
# the minor cadence. The same four-note cells played four times as fast (3+1+2+2 sixteenths) are the
# plucked ostinato of the gear train: the gears are the theme in diminution.
#
# Form (bars of 4/4, 2 s each):
#   winding 8 | dial 8 | movement 16 | cathedral 16 | orrery 12 | build 8 | climax 16 | coda 8 | end 2  = 94 bars, 188 s
#   The tick is absent while the watch is wound (bars 0-3), drops out among the planets (bars 48-56),
#   comes back faltering (bars 56-60: the times of those ticks are also the mechanism's beats in the
#   pictures), and the last bar of the build (bar 67) is silent: time stops before the climax.
version: 1
title: Escapement
description: A clock in D minor at 120 BPM - winding, a ticking pulse, a theme that climbs by fourths, an ostinato that is the theme four times as fast, great drums and bells, a silent bar, and a climax that resolves in D major.
key: D minor
tempo: 120
seed: 11
loop: false
progression: "Dm Dm Bb Bb Gm Gm A A"
chord_bars: 1
master: {lowpass: 12000, highpass: 28}
sections:
  - {name: winding, bars: 8, progression: "Dm(add9) Dm(add9) Dm(add9) Dm(add9) Bb/D Bb/D Dm(add9) Dm(add9)"}
  - {name: dial, bars: 8, progression: "Dm Dm Bbmaj7 Bbmaj7 Gm Gm Asus4 A"}
  - {name: movement, bars: 16, progression: "Dm Dm Bb Bb Gm Gm Asus4 A"}
  - {name: cathedral, bars: 16, progression: "Dm Dm Bb Bb Gm Gm Asus4 A Dm Dm Bb Bb Gm Gm A Dm"}
  - {name: orrery, bars: 12, progression: "Bbmaj7 Bbmaj7 F/A F/A Gm7 Gm7 Dm(add9) Dm(add9) Bbmaj7 Bbmaj7 Asus4 Asus4"}
  - {name: build, bars: 8, progression: "Dm/A Dm/A A A Dm/A Dm/A A A"}
  - {name: climax, bars: 16, progression: "Dm Dm Bb Bb Gm Gm Asus4 A Dm Dm Bb Bb C C D D"}
  - {name: coda, bars: 8, progression: "D D Gm/D Gm/D D D D D"}
  - {name: end, bars: 2, progression: "D D"}                      # only the clock, while the last chord rings

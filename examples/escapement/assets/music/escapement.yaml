                       "A4 - - G5 E5 - D5 - A4 - - G5 E5 - D5 -", "A4 - - G5 E5 - C#5 - A4 - - G5 E5 - C#5 -",
                       "D5 - - E5 F5 - A5 - D5 - - E5 F5 - A5 -", "D5 - - E5 F5 - A5 - D5 - - E5 F5 - A5 -",
                       "G5 - - F5 D5 - Bb4 - G5 - - F5 D5 - Bb4 -", "G5 - - F5 D5 - Bb4 - G5 - - F5 D5 - Bb4 -",
                       "E5 - - G5 C6 - Bb5 - E5 - - G5 C6 - Bb5 -", "E5 - - G5 C6 - Bb5 - E5 - - G5 C6 - Bb5 -",
                       "A5 - - F#5 D5 - F#5 - A5 - - F#5 D5 - F#5 -", "A5 - - F#5 D6 - A5 - D6 - - - - - - -"]}
  # ------------------------------------------------------------------ pads
  pad:
    instrument: pad
    play: chords
    settings: {tone: 2600, air: 0.4, sub: 0.45}
    volume: -3
    sections:
      winding: {volume: [[0, -12], [1, -6], [8, -4]], lowpass: {from: 500, to: 2200}, width: 1.3, settings: {tone: 2200, air: 0.5, sub: 0.6, fade: 2.5}}
      dial: {volume: -5, settings: {tone: 2200, air: 0.4, sub: 0.45, fade: 1.6}}
      movement: {volume: {from: -7, to: -5}, settings: {tone: 2000, air: 0.35, sub: 0.4}}
      cathedral: {volume: -6, settings: {tone: 2200, air: 0.3, sub: 0.35}}
      orrery: {volume: [[0, -8], [8, -7], [12, -12]], width: 1.35, settings: {tone: 3400, air: 0.7, sub: 0.55, fade: 2.4}}
      build: {volume: [[0, -8], [7, -5], [7.05, -60], [8, -60]], settings: {tone: 2400, air: 0.3, sub: 0.3, fade: 0.3}}
      climax: {volume: -3, width: 1.4, settings: {tone: 3400, air: 0.5, sub: 0.45}}
      coda: {volume: [[0, -3], [5, -3], [8, -12]], width: 1.3, settings: {tone: 3000, air: 0.7, sub: 0.6, fade: 2.6}}
      end: {volume: {from: -12, to: -34}, width: 1.3, settings: {tone: 2400, air: 0.7, sub: 0.6, fade: 2.6}}
  glass:
    instrument: glass
    play: chords
    volume: 0
    only: [winding, dial, orrery, climax, coda]
    sections:
      winding: {volume: {from: -8, to: 0}}
      dial: {volume: 1}
      orrery: {volume: [[0, 2], [8, 2], [12, -4]]}
      climax: {volume: 1}
      coda: {volume: {from: 4, to: -4}}
  strings:            # a wall of strings: dark among the gears, opening through the build, wide open at the climax
    instrument: supersaw
    play: chords
    settings: {tone: 5000, fade: 0.3, detune: 30}
    only: [movement, cathedral, build, climax]
    sections:
      movement: {lowpass: [[0, 200], [8, 500], [16, 1700]], volume: [[0, -30], [8, -10], [16, 0]]}
      cathedral: {lowpass: [[0, 1700], [8, 2400], [16, 3600]], volume: [[0, 1], [16, 3]], width: 1.3}
      build: {lowpass: [[0, 900], [7, 7000], [8, 7000]], volume: [[0, -3], [7, 4], [7.05, -60], [8, -60]],
              gate: {steps: "XxxX xxXx XxxX xxXx", duty: 0.6, floor: 0.12}}
      climax: {lowpass: 9500, volume: 4.5, width: 1.55, settings: {tone: 6000, fade: 0.3, detune: 34}}
  # ------------------------------------------------------------------ the theme
  box:                # the theme stated simply on a music box (dial); far away among the planets; at the end in D major
    instrument: music_box
    settings: {decay: 1.4, tone: 5200, ring: 3.0}
    reverb: {size: 3.6, mix: 0.35, tone: 5500}
    echo: {delay: 1.5, feedback: 0.3, repeats: 2, pingpong: true}
    spread: 0.2
    volume: 3
    only: [winding, dial, orrery, coda]
    sections:
      winding:        # the first cell, twice, as if remembered
        steps: ". | . | . | . | . | A5 . . . . . . . . . . . D6 . . . | F6 . . . . . . . E6 . . . . . . . | ."
        volume: -2
      dial:
        steps: &themeA
          - "A4 - - - - - - - - - - - D5 - - - | F5 - - - - - - - E5 - - - - - - -"
          - "D5 - - - - - - - - - - - F5 - - - | A5 - - - - - - - G5 - - - - - - -"
          - "G5 - - - - - - - - - - - Bb5 - - - | D6 - - - - - - - C6 - - - - - - -"
          - "A5 - - - - - - - - - - - G5 - - - | E5 - - - - - - - C#5 - - - - - - -"
        transpose: 12
        volume: 4
      orrery:         # the climbing cell over Bb, F, Gm, D minor: the same shape under another sky
        steps: "D5 . . . . . . . . . . . F5 . . . | A5 . . . . . . . G5 . . . . . . . | C5 . . . . . . . . . . . F5 . . . | A5 . . . . . . . G5 . . . . . . . | D5 . . . . . . . . . . . G5 . . . | Bb5 . . . . . . . A5 . . . . . . . | A5 . . . . . . . . . . . F5 . . . | E5 . . . . . . . D5 . . . . . . . | . | . | . | ."
        transpose: 12
        volume: 3
      coda:           # the theme's first cells in D major, and the last word: A, F#, D
        steps: "A4 . . . . . . . . . . . D5 . . . | F#5 . . . . . . . E5 . . . . . . . | D5 . . . . . . . . . . . G5 . . . | Bb5 . . . . . . . A5 . . . . . . . | A5 . . . . . . . . . . . F#5 . . . | D5 . . . . . . . . . . . . . . . | . | ."
        transpose: 12
        volume: {from: 4, to: 2}
  horn:               # the theme sung in the tenor (movement, second half), then with the brass in full
    instrument: saw_pad
    octave: 4
    settings: {tone: 1700, attack: 0.14, release: 0.7, detune: 12}
    reverb: {size: 3.6, mix: 0.32, tone: 3200}
    pan: -0.1
    width: 0.7
    only: [movement, cathedral, climax]
    steps: *themeA
    transpose: -12
    sections:
      movement:
        steps: [". | .", ". | .", ". | .", ". | .",
                "A4 - - - - - - - - - - - D5 - - - | F5 - - - - - - - E5 - - - - - - -",
                "D5 - - - - - - - - - - - F5 - - - | A5 - - - - - - - G5 - - - - - - -",
                "G5 - - - - - - - - - - - Bb5 - - - | D6 - - - - - - - C6 - - - - - - -",
                "A5 - - - - - - - - - - - G5 - - - | E5 - - - - - - - C#5 - - - - - - -"]
        volume: {from: -1, to: 2}
      cathedral:
        steps: &themeAB
          - "A4 - - - - - - - - - - - D5 - - - | F5 - - - - - - - E5 - - - - - - -"
          - "D5 - - - - - - - - - - - F5 - - - | A5 - - - - - - - G5 - - - - - - -"
          - "G5 - - - - - - - - - - - Bb5 - - - | D6 - - - - - - - C6 - - - - - - -"
          - "A5 - - - - - - - - - - - G5 - - - | E5 - - - - - - - C#5 - - - - - - -"
          - "D5 - - - - - - - - - - - E5 - - - | F5 - - - - - - - A5 - - - - - - -"
          - "G5 - - - - - - - - - - - F5 - - - | D5 - - - - - - - - - - - - - - -"
          - "Bb4 - - - - - - - - - - - D5 - - - | G5 - - - - - - - F5 - - - - - - -"
          - "E5 - - - - - - - - - - - C#5 - - - | D5 - - - - - - - - - - - . . . ."
        volume: 3
        settings: {tone: 2200, attack: 0.1, release: 0.6, detune: 14}
      climax:
        steps: &themeUp
          - "A4 - - - - - - - - - - - D5 - - - | F5 - - - - - - - E5 - - - - - - -"
          - "D5 - - - - - - - - - - - F5 - - - | A5 - - - - - - - G5 - - - - - - -"
          - "G5 - - - - - - - - - - - Bb5 - - - | D6 - - - - - - - C6 - - - - - - -"
          - "A5 - - - - - - - - - - - G5 - - - | E5 - - - - - - - C#5 - - - - - - -"
          - "D5 - - - - - - - - - - - E5 - - - | F5 - - - - - - - A5 - - - - - - -"
          - "G5 - - - - - - - - - - - F5 - - - | D5 - - - - - - - - - - - - - - -"
          - "E5 - - - - - - - - - - - G5 - - - | C6 - - - - - - - Bb5 - - - - - - -"
          - "A5 - - - - - - - - - - - F#5 - - - | D6 - - - - - - - - - - - - - - -"
        volume: 3
        settings: {tone: 2600, attack: 0.08, release: 0.6, detune: 16}
  lead:               # a singing lead on the theme: among the great gears (second phrase) and at the climax
    instrument: soft_lead
    settings: {attack: 0.06, vibrato: 18, tone: 3600, ring: 0.5}
    reverb: {size: 4.2, mix: 0.4, tone: 4500, predelay: 0.04}
    echo: {delay: 1.5, feedback: 0.25, repeats: 2, pingpong: true}
    only: [cathedral, climax]
    steps: *themeAB
    sections:
      cathedral: {volume: [[0, -40], [7.9, -40], [8, 8], [16, 10]]}
      climax: {steps: *themeUp, volume: 10, settings: {attack: 0.04, vibrato: 20, tone: 4200, ring: 0.5}}
  choir:              # the theme an octave above in wide saws: only at the climax
    instrument: supersaw

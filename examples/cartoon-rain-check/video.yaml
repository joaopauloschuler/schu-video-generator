# A weather cartoon: picnic, wind, rain, night (rain_check.md via `vidgen screenplay`, hand-edited).
# Composed music (compose:, §84): playful, tense for the storm, sleepy at night; scene changes on
# bar lines, a pause before the last line. Needs the music extra, else the moods' beds play.
# No audio committed: run `vidgen tts` (Kokoro, free).
title: Rain Check
format: {width: 1280, height: 720, fps: 30}
preview: {width: 640, height: 360, fps: 15}
theme: {preset: soft_pastel}
voice: {provider: kokoro, voice: bf_emma, speed: 0.75}
narration: {pad: 0.7}
auto_direct: true
voices:
  pip_voice: {voice: af_heart, label: Pip, speed: 0.75, color: primary}
  juno_voice: {voice: am_fenrir, label: Juno, speed: 0.7, color: accent}
characters:
  - name: pip
    voice: pip_voice
    look: {body: round, head_size: 1.15, eyes: round, hair: bun, accessories: [scarf]}
    colors: {skin: "#F2C9A0", clothes: primary, hair: "#6B4226", accessory: accent}
  - name: juno
    voice: juno_voice
    look: {body: tall, eyes: oval, nose: round, hair: short, ears: round, accessories: [hat]}
    colors: {skin: "#B97A4E", clothes: "#5B6C8F", hair: "#2B2B2B", accessory: secondary}
sets:
  meadow:
    background: ["#9CCBEA", "#E4F3FB"]
    ground_color: tertiary
    props: [{prop: tree, at: 0.8, depth: 0.4}]
scenes:
  - id: meadow
    type: stage
    set: meadow
    params:
      props:
        - {prop: basket, at: 0.3}
        - {prop: umbrella, at: 0.62}
        - {prop: cloud, at: 0.09, scale: 0.8}
      characters: [{name: pip, at: 0.22}, {name: juno, at: 0.6}]
    beats:
      - text: "It was a perfect morning for a picnic, and Pip had packed for two."
        actions:
          - {hold: juno, to: umbrella, at: 0}
          - {pick_up: pip, to: basket, at: 0.45}
      - text: "I packed sandwiches, napkins and lemonade. Will the weather hold, Juno?"
        voice: pip_voice
        actions: [{react: pip, expression: happy}]
      - text: "Not a cloud in the sky, Pip. I checked."
        voice: juno_voice
        actions:
          - {look_at: juno, to: camera, at: 0.45}
          - {keyframes: cloud, keys: [{t: "100%", x: 0.66, ease: linear}]}
          - {look_at: pip, to: cloud, at: 0.75}
      - text: "The cloud had not checked."
        actions: [{react: pip, expression: worried, at: 0.2}]
  - id: picnic
    type: stage
    set: meadow
    params:
      wind: 0.15
      props:
        - {prop: rock, at: 0.38}
        - {prop: rock, name: stone, at: 0.6}
        - {prop: basket, at: 0.49}
        - {prop: napkin, at: 0.3}
        - {prop: umbrella, at: 0.68}
        - {prop: cloud, at: 0.66, scale: 0.8}
      characters: [{name: pip, at: 0.3}, {name: juno, at: 0.68}]
    beats:
      - text: "They sat down on two flat rocks, in the warm sun."
        actions:
          - {hold: pip, to: napkin, at: 0}
          - {hold: juno, to: umbrella, at: 0}
          - {sit_on: pip, to: rock, at: 0.2}
          - {sit_on: juno, to: stone, at: 0.4}
      - text: "One cheese sandwich, in a napkin, for our weather expert."
        voice: pip_voice
        actions: [{give: pip, to: juno, at: 0.55}]
      - text: "Thank you. A perfect day for a perfect sandwich."
        voice: juno_voice
        actions:
          - {wind: windy, at: 0.4, run_time: 2}
          - {particles: leaves, at: 0.4, keep: true}
          - {particles: streaks, at: 0.4, keep: true}
      - text: "Ah. That is a refreshing breeze."
        voice: juno_voice
        actions: [{blow_away: napkin, at: 0.1}]
      - text: "That was your sandwich, Juno."
        voice: pip_voice
        shot: closeup pip
        actions: [{react: pip, expression: neutral}]
  - id: storm
    type: stage
    set: meadow
    music: {mood: tense, volume: -3}                    # under the rain bed (-32 LUFS)
    params:
      wind: windy
      props:
        - {prop: rock, at: 0.38}
        - {prop: rock, name: stone, at: 0.6}
        - {prop: basket, at: 0.49}
        - {prop: umbrella, at: 0.68}
      characters: [{name: pip, at: 0.42}, {name: juno, at: 0.68}]
    beats:
      - text: "Then the cloud did what clouds do."
        actions:
          - {hold: juno, to: umbrella, at: 0}
          - {action: light, tint: "#5D6A84", strength: 0.55, at: 0.1, run_time: 3}
          - {particles: rain, at: 0.3, keep: true, density: 1.3, puddles: true}
      - text: "Rain! Grab the basket and run for the tree!"
        voice: pip_voice
        actions:
          - {react: pip, expression: surprised}
          - {pick_up: pip, to: basket, at: 0.25}
          - {walk_to: pip, to: 0.72, speed: 5, at: 0.6}
          - {walk_to: juno, to: 0.88, speed: 5, at: 0.6}
      - text: "Relax, Pip! It is just a little shower!"
        voice: juno_voice
      - text: "It is a storm, Juno! A real storm!"
        voice: pip_voice
        overlap: 0.4
        actions: [{react: pip, expression: angry}]
      - text: "Trust me, a shower like this never lasts longer than a minute."
        voice: juno_voice
      - text: "Juno. Your umbrella."
        voice: pip_voice
        interrupt: true
        actions: [{open: umbrella, at: 0.85}]
      - text: "The umbrella left without him."
        actions:
          - {wind: gale, at: 0.1, run_time: 0.5}
          - {blow_away: umbrella, at: 0.2}
          - {react: juno, expression: surprised, at: 0.5}
  - id: night
    type: stage
    set: meadow
    music: {mood: sleepy, volume: -3}
    params:
      light: night
      props: [{prop: basket, at: 0.66}]
      characters: [{name: pip, at: 0.72, facing: right}, {name: juno, at: 0.88, facing: left}]
    beats:
      - text: "By nightfall, the rain had finally run out of rain."
        actions: [{particles: rain, density: 0.8}]
      - text: "Our sandwiches are soup, Juno."
        voice: pip_voice
        auto_direct: {closeups: false}           # the close-up is saved for Juno's answer
        actions: [{react: pip, expression: sad, at: 0.3}]
      - text: "Tomorrow will be sunny. I checked."
        voice: juno_voice
        sting: comic
        shot: {kind: closeup, of: juno, move: true}
        actions: [{look_at: juno, to: camera, at: 0.2}]
      - text: "It rained for the rest of the week."
        actions: [{particles: rain, at: 0.5, keep: true}]
output: rain_check
overlays: [{type: captions, speakers: color}]
music: {compose: playful, volume: -2}

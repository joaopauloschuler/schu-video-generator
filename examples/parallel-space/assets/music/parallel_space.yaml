# Parallel Space: the cinematic hybrid of Night Drive (assets/music/night_drive.yaml, kept beside
# it as the original). Same tempo (138.46 BPM: one bar is exactly 52 frames at 30 fps), same key
# (F# minor), same hook and the same trance drop; a new cinematic opening, an ostinato that grows
# layer by layer, a breakdown where a men's choir carries the hook over wide pads, a build
# that stops for a breath before the hit, a second, higher climax and a spacious coda that resolves
# on F# major. Everything is played by vidgen's own synthesizer: no samples, no SoundFont.
#
# The orchestra (v7): no high synth leads. What v6 played on soft_lead and pads in the high
# middle register is now sung or bowed, one or two octaves lower:
#   trumpet  (the name the pictures read) a men's choir: ooh at dawn (A2-F#3), a hummed mm in the groove,
#            aah in the coda (octave 3)
#   hook     a men's choir an octave under v6 (F#3-A4): ooh in the breakdown, aah in heart2; in the drop
#            and the climax it only doubles the supersaw lead underneath, an octave or two down
#   voice    the choir's basses an octave under the hook (F#2-A3): the low body
#   violins  real violins an octave under v6 (heart2), violas in the climax
#   swell    violas in octave 3, each note swelling in;  spicc: violas, spiccato, octave 3;  vla: cellos, short strokes
#   horn     the real horn section;  organ: the real organ, a soft flute stop, an octave lower (octave 3)
#   frame    a low frame drum: the kick's sine at 150 -> 66 Hz, short, in a hall
#   brass    low sustained swells (saw pad, octave 2), as before
#
# Form (bars of 4/4; 8 bars = 13.867 s; every section is a multiple of 8 bars, so scenes cut on bars):
#   dawn 8 | pulse 16 | groove 16 | heart 8 | heart2 8 | build 8 | drop 16 | climax 8 | afterglow 8 | coda 8
#   = 104 bars, 180.27 s, plus the last chord's tail.
version: 1
title: Parallel Space
description: Night Drive as a cinematic hybrid in F# minor - a slow opening, a growing ostinato, the hook on a singing lead, the trance drop with low swells and big drums, a higher climax and a coda that resolves.
key: F# minor
tempo: 138.4615                    # 138.4615385 would round each bar down to 51.99 frames; this gives exactly 52
seed: 7
loop: false
progression: "i VI III VII"        # F#m D A E, two bars each (Night Drive's progression)
chord_bars: 2
master: {lowpass: 12000, highpass: 28}
sections:
  - {name: dawn, bars: 8, progression: "F#m(add9) D/F#", chord_bars: 4}     # a pedal F# under two slow chords
  - {name: pulse, bars: 16}
  - {name: groove, bars: 16}
  - {name: heart, bars: 8, progression: "F#m(add9) Dmaj7 A(add9) E"}
  - {name: heart2, bars: 8, progression: "F#m(add9) Dmaj7 A(add9) E"}
  - {name: build, bars: 8}
  - {name: drop, bars: 16}
  - {name: climax, bars: 8, progression: "D E F#m A"}                       # starts on VI and climbs: the lift
  - {name: afterglow, bars: 8}
  - {name: coda, bars: 8, progression: "D E F# F#"}                         # VI VII I: it resolves on the major chord
tracks:
  # ------------------------------------------------------------------ drums
  kick:
    instrument: kick
    settings: {high: 125, low: 46, decay: 0.22, click: 0.12}
    steps: "x... x... x... x..."
    only: [pulse, groove, build, drop, climax, afterglow]
    sections:
      pulse:          # a heartbeat from bar 9
        settings: {high: 96, low: 42, decay: 0.3, click: 0.03}
        volume: -4
        steps: ". | . | . | . | . | . | . | . | x... .... ..x. .... | x... .... ..x. .... | x... .... ..x. .... | x... .... ..x. .... | x... .... ..x. .... | x... .... ..x. .... | x... .... ..x. .... | x... .... .... ...."
      build: {steps: ["x... x... x... x...", "x... x... x... x...", "x... x... x... x...", "x... x... x... x...",
                      "x... x... x... x...", "x... x... x... x...", "x... x... x... x...", "...."]}
      afterglow:      # the heartbeat again, walking away
        settings: {high: 96, low: 42, decay: 0.3, click: 0.03}
        steps: "x... .... ..x. ...."
        volume: {from: -3, to: -18}
  taiko:              # big low drum in a hall (the kick's sine, lower and longer)
    instrument: kick
    settings: {high: 105, low: 44, decay: 0.3, click: 0.14}
    reverb: {size: 3.0, mix: 0.4, tone: 2600}
    volume: 3
    only: [pulse, heart2, build, drop, climax, afterglow, coda]
    sections:
      pulse:
        steps: "X... .... .... .... | . | . | . | X... .... .... .... | . | . | .... .... .... x.x. | X... .... .... .... | . | X... .... .... .... | .... .... ..x. x.x. | X... .... ..x. .... | X... .... ..x. .... | X... ..x. ..x. ..x. | x.x. x.x. x.xx xxxx"
        volume: [[0, -4], [12, -2], [16, 0]]
      heart2: {steps: ". | . | . | . | X... .... .... .... | . | . | .... .... x... x.x.", volume: 0}
      build:
        steps: ["x... .... x... ....", "x... .... x... ....", "x... .... x... ....", "x... .... x... ....",
                "x... x... x... x...", "x... x... x... x...", "x.x. x.x. x.x. x.x.", "xxxx xxxx xx.. ...."]
        volume: [[0, -5], [6, -2], [8, 1]]
      drop: {steps: ["X... .... .... ....", ".", ".", ".... .... ..x. x.xx"], volume: 2}
      climax: {steps: ["X... .... .... ....", ".... .... x.x. x.xx"], volume: 0}
      afterglow: {steps: "X... .... .... .... | . | . | . | x... .... .... .... | . | . | .", volume: 1}
      coda: {steps: "X... .... .... .... | . | . | . | X... .... .... .... | . | . | .", volume: 1}
  tom:                # a higher drum answering the taiko
    instrument: kick
    settings: {high: 155, low: 68, decay: 0.24, click: 0.2}
    reverb: {size: 2.4, mix: 0.35, tone: 3000}
    pan: 0.25
    volume: 1
    only: [pulse, build, drop, climax]
    sections:
      pulse:
        steps: ". | . | . | .... .... .... ..x. | . | . | . | .... .... x.x. .... | . | . | . | .... .... x... .... | .... x... .... x... | .... x... .... x... | .... x... x... .x.x | .x.x .x.x .x.. ...."
        volume: [[0, -5], [12, -3], [16, -1]]
      build:
        steps: [".", ".", ".... .... .... x.x.", ".... .... .... x.xx", ".... x... .... x...", "..x. ..x. ..x. ..x.", ".x.x .x.x .x.x .x.x", "xxxx xxxx xx.. ...."]
        volume: [[0, -4], [8, 0]]
      drop: {steps: [".", ".", ".", ".... .... x.x. ...."]}
      climax: {steps: [".", ".... x... .x.x ...."], volume: 0}
  boom:
    instrument: boom
    settings: {low: 36, decay: 1.5}
    steps: "x | . | . | . | . | . | . | ."
    volume: 3
    rest: [build]
    sections:
      dawn: {steps: "x | . | . | . | x | . | . | .", volume: 2}
      heart: {volume: 1}
      heart2: {volume: 1}
      afterglow: {volume: 1}
      coda: {steps: "x | . | . | . | x | . | . | .", volume: 1}
  tick:               # the clock: a ticking pulse through the cinematic parts
    instrument: tick
    steps: "X.o. x.o. X.o. x.o."
    spread: 0.45
    volume: 14
    reverb: {size: 1.2, mix: 0.2}
    only: [dawn, pulse, heart2, build, afterglow, coda]
    sections:
      dawn: {steps: ". | . | . | . | X... x... X... x... | X... x... X... x... | X.o. x.o. X.o. x.o. | X.o. x.o. X.o. x.o.", volume: {from: 9, to: 14}}
      heart2: {volume: {from: 6, to: 14}}
      build: {steps: ["X.o. x.o. X.o. x.o.", "X.o. x.o. X.o. x.o.", "X.o. x.o. X.o. x.o.", "X.o. x.o. X.o. x.o.",
                      "X.o. x.o. X.o. x.o.", "X.o. x.o. X.o. x.o.", "X.o. x.o. X.o. x.o.", "X.o. x.o. X... ...."]}
      afterglow: {volume: {from: 14, to: 11}}
      coda: {steps: "X.o. x.o. X.o. x.o. | X.o. x.o. X.o. x.o. | X... x... X... x... | X... x... X... x... | X... .... x... .... | X... .... x... .... | X... .... .... .... | .", volume: {from: 11, to: 3}}
  hat:
    instrument: hat
    steps: "o.x. o.x. o.x. o.xo"
    spread: 0.3
    volume: 10
    only: [groove, build, drop, climax]
    sections:
      build: {steps: ["o.x. o.x. o.x. o.xo", "o.x. o.x. o.x. o.xo", "o.x. o.x. o.x. o.xo", "o.x. o.x. o.x. o.xo",
                      "o.x. o.x. o.x. o.xo", "o.x. o.x. o.x. o.xo", "oxxo oxxo oxxo oxxo", "oxxo oxxo ox.. ...."]}
      climax: {steps: "oxxo oxxo oxxo oxxx", volume: 11}
  ohat:
    instrument: open_hat
    steps: "..x. ..x. ..x. ..x."
    pan: 0.15
    volume: 9
    only: [groove, build, drop, climax]
    sections:
      build: {steps: ["..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.",
                      "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. .... ...."]}
  crash:
    instrument: open_hat
    settings: {decay: 0.2, tone: 8000}
    steps: "x | . | . | . | . | . | . | ."
    volume: 9
    width: 1.6
    only: [groove, drop, climax]
    sections:
      drop: {steps: "X | . | . | . | x | . | . | ."}
      climax: {steps: "X | . | x | .", volume: 10}
  clap:
    instrument: clap
    steps: "....x.......x..."
    reverb: {size: 1.2, mix: 0.25}
    volume: 9
    only: [groove, drop, climax]
  snare:              # the 80s gated snare under the clap: a bigger backbeat in the drop
    instrument: gated_snare
    settings: {gate: 0.2, body: 200}
    steps: "....x.......x..."
    volume: 3
    only: [drop, climax]
    sections:
      climax: {volume: 4, steps: ["....x.......x...", "....x.......x.xx"]}
  roll:
    instrument: clap
    only: [build]
    steps: ["x... x... x... x...", "x... x... x... x...", "x... x... x... x...", "x... x... x... x...",
            "x.x. x.x. x.x. x.x.", "x.x. x.x. x.x. x.x.", "xxxx xxxx xxxx xxxx", "xxxx xxxx xx.. ...."]
    volume: [[0, -4], [7, 7], [8, 10]]
    reverb: {size: 1.6, mix: 0.3}
  frame:              # a low frame drum far away in a hall: the hook's 3+3+2 before anything plays it (v5: pulsar chirps)
    instrument: kick
    settings: {high: 150, low: 66, decay: 0.11, click: 0.12}
    steps: "x..o..x.o..x..o."
    spread: 0.3
    highpass: 60
    reverb: {size: 3.4, mix: 0.45, tone: 2200}
    volume: -9
    only: [dawn, heart]
    sections:
      dawn: {steps: ["x..o..x.o..x..o.", "."], volume: {from: -8, to: -13}}
      heart: {steps: ["x..o..x.o..x..o.", ".", ".", "."], volume: -10}
  # ------------------------------------------------------------------ bass
  bass:
    instrument: analog_bass
    settings: {tone: 1600, closed: 300, detune: 10}
    steps: "..x. ..x. ..x. ..x."
    volume: 3
    only: [groove, build, drop, climax]
    sections:
      build: {steps: ["..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.",
                      "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "..x. ..x. ..x. ..x.", "...."]}
      drop: {steps: ".xxx .xxx .xxx .xxx", volume: 2, settings: {tone: 2200, closed: 380, detune: 12}}
      climax: {steps: ".xx'x .xx'x .xx'x .xx'x", volume: 2, settings: {tone: 2400, closed: 400, detune: 12}}
  sub:                # a sine an octave under the bass, off the kick
    instrument: sub
    octave: 1
    settings: {decay: 0.35, tone: 400, second: 0.1}
    steps: "..x. ..x. ..x. ..x."
    volume: -3
    only: [groove, drop, climax]
    sections:
      groove: {volume: -6}
  # ------------------------------------------------------------------ ostinato
  ost:                # the ostinato: sixteenths with the hook's 3+3+2 accents, growing layer by layer
    instrument: synth_bass
    octave: 3
    settings: {decay: 0.09, tone: 1300, ring: 0.03}
    steps: "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1"
    accent: "3+3+2"
    spread: 0.2
    reverb: {size: 1.4, mix: 0.18}
    only: [pulse, groove, heart2, build, drop, climax, afterglow]
    sections:
      pulse: {lowpass: [[0, 420], [8, 1200], [16, 3400]], volume: [[0, -9], [8, -2], [16, 2]]}
      groove: {lowpass: 1500, volume: -7}
      heart2: {lowpass: {from: 500, to: 2200}, volume: {from: -14, to: -3}}
      build: {lowpass: {from: 1500, to: 5000}, volume: {from: -4, to: 1},
              steps: ["5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1",
                      "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 1 5 1 1 3 1", "5 1 1 5 1 1 8 1 5 1 . . . . . ."]}
      drop: {lowpass: 3000, volume: -5}
      climax: {lowpass: 4500, volume: -3}
      afterglow: {lowpass: {from: 2600, to: 500}, volume: {from: -4, to: -22}}
  vla:                # the figure's accents as short cello strokes in octave 3 (v6: soft_lead strokes in octave 4)
    instrument: cellos
    octave: 3
    settings: {stroke: spiccato, length: 0.11, brightness: 0.35, accent: 0.9, players: 4}
    steps: "5 - . 5 - . 8 - 5 - . 5 - . 3 -"
    spread: 0.3
    pan: 0.25
    reverb: {size: 2.2, mix: 0.25, tone: 3200}
    only: [pulse, heart2, build]
    sections:
      pulse: {steps: ". | . | . | . | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 - | 5 - . 5 - . 8 - 5 - . 5 - . 3 -",
              volume: [[4, -8.4], [16, 0.6]], lowpass: [[4, 900], [16, 2400]]}
      heart2: {volume: {from: -12.4, to: -2.4}, lowpass: {from: 800, to: 2200}}
      build: {volume: {from: -3.4, to: 1.6}, lowpass: {from: 1500, to: 3200},
              steps: ["5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . 5 - . 3 -",
                      "5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . 5 - . 3 -", "5 - . 5 - . 8 - 5 - . . . . . ."]}
  # ------------------------------------------------------------------ pads and swells
  saws:
    instrument: supersaw
    play: chords
    settings: {tone: 5000, fade: 0.25, detune: 34}
    duck: {to: kick, depth: 0.6, release: 0.14}
    only: [pulse, groove, build, drop, climax, afterglow]
    sections:
      pulse: {lowpass: [[0, 180], [8, 420], [16, 2000]], volume: [[0, -30], [8, -7], [16, 4]]}     # a long swell under the ostinato
      groove: {volume: 6, lowpass: [[0, 1800], [16, 4200]], gate: {steps: "X..x..x.X..x..x.", duty: 0.5, floor: 0.1}}
      build: {lowpass: [[0, 1200], [8, 7000]], gate: {steps: "XxxX xxXx XxxX xxXx", duty: 0.55, floor: 0.05},
              volume: [[0, 2], [7.6, 5], [7.66, -50], [8, -50]]}                                # ...and a breath of silence before the hit
      drop: {lowpass: 9000, volume: 5, width: 1.5, settings: {tone: 6000, fade: 0.25, detune: 34}}
      climax: {lowpass: 10500, volume: 5.5, width: 1.6, settings: {tone: 6000, fade: 0.25, detune: 36}}
      afterglow: {lowpass: {from: 3200, to: 350}, volume: {from: -2, to: -20}}
  pad:
    instrument: pad
    play: chords
    settings: {tone: 3200, air: 0.5, sub: 0.45}
    volume: -1
    sections:
      dawn: {volume: [[0, -20], [3, -9], [8, -6]], lowpass: {from: 450, to: 2600}, width: 1.3, settings: {tone: 2400, air: 0.6, sub: 0.2, fade: 3.0}, highpass: 150}

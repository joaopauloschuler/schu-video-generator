      groove: {volume: -9, settings: {tone: 1800, air: 0.3, sub: 0.3}}
      heart: {volume: {from: -7, to: -4}, width: 1.15, settings: {tone: 3200, air: 0.6, sub: 0.15, fade: 2.2}, highpass: 180}
      heart2: {volume: {from: -4, to: -2}, width: 1.25, settings: {tone: 3600, air: 0.7, sub: 0.2, fade: 2.2}, highpass: 160}
      build: {volume: [[0, -6], [7.6, -5], [7.66, -50], [8, -50]]}
      drop: {volume: -4}
      climax: {volume: -3, width: 1.4}
      afterglow: {volume: {from: -3, to: -6}, width: 1.25, settings: {tone: 2800, air: 0.6, sub: 0.2, fade: 2.2}, highpass: 160}
      coda: {volume: [[0, -5], [5, -4], [8, -14]], width: 1.25, settings: {tone: 2600, air: 0.7, sub: 0.2, fade: 3.0}, highpass: 170}
  organ:              # a real organ on a soft flute stop holding the chords in octave 3 (v6: the near-sine glass pad in octave 4)
    instrument: organ
    octave: 3
    steps: "* | - - - - - - - - - - - - - - - ."           # a chord every two bars, lifted for a breath before the next
    settings: {registration: flute, tone: 2400, chiff: 0.5, detune: 2}
    highpass: 200
    width: 0.8
    reverb: {size: 4.2, mix: 0.36, tone: 3200}
    volume: -3.5
    only: [dawn, heart, heart2, drop, climax, afterglow, coda]
    sections:
      dawn: {volume: {from: -11.5, to: -1.5}, steps: "* | - | - | - - - - - - - - - - - - - - - ."}
      heart: {volume: -0.5}
      heart2: {volume: 0.5}
      afterglow: {volume: -0.5}
      coda: {volume: [[0, -0.5], [6, 1.5], [8, -6.5]], steps: "* | - | * | - | * | - | - | - - - - - - - - - - - - - - - ."}
  brass:              # low sustained swells: root, fifth and octave, each chord fading in slowly
    instrument: saw_pad
    octave: 2
    settings: {tone: 1100, attack: 1.3, release: 1.2, detune: 16}
    steps: "1+5+8 | -"
    reverb: {size: 2.6, mix: 0.25}
    width: 0.4
    duck: {to: kick, depth: 0.4, release: 0.16}
    only: [pulse, heart2, build, drop, climax, afterglow, coda]
    sections:
      pulse: {steps: ". | . | . | . | . | . | . | . | 1+5+8 | - | 1+5+8 | - | 1+5+8 | - | 1+5+8 | -", volume: [[8, -8], [16, 1]], lowpass: [[8, 500], [16, 1500]]}
      heart2: {volume: {from: -13, to: -5}, lowpass: {from: 500, to: 1400}}
      build: {volume: [[0, -4], [7.6, 2], [7.66, -50], [8, -50]], lowpass: {from: 700, to: 2600}}
      drop: {volume: 0, lowpass: 1800, settings: {tone: 1500, attack: 0.5, release: 0.8, detune: 18}}
      climax: {volume: 2, lowpass: 2600, settings: {tone: 1900, attack: 0.4, release: 0.8, detune: 20}}
      afterglow: {volume: {from: -2, to: -9}, lowpass: {from: 1400, to: 500}}
      coda: {volume: [[0, -7], [4, -4], [8, -12]], lowpass: 700}
  # ------------------------------------------------------------------ short strings, choir, violas
  spicc:              # sixteenths as short viola strokes in octave 3 (v6: soft_lead strokes in octave 4; v5: a bright FM pluck)
    instrument: violas
    steps: "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3"
    accent: "3+3+2"
    octave: 3
    settings: {stroke: spiccato, length: 0.07, brightness: 0.3, accent: 0.8, players: 5}
    volume: -1.5
    spread: 0.3
    pan: -0.05
    highpass: 150
    reverb: {size: 1.8, mix: 0.2, tone: 3500}
    only: [groove, build, drop, climax]
    sections:
      groove: {lowpass: [[0, 900], [16, 2600]], volume: -0.5}
      build: {lowpass: [[0, 1200], [8, 4000]],
              steps: ["1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3",
                      "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 1 5 8 1 5 8 5 3", "1 5 8 1 5 8 5 3 . . . . . . . ."]}
      drop: {settings: {stroke: spiccato, length: 0.07, brightness: 0.42, accent: 1.0, players: 5}, volume: -1.5}
      climax: {settings: {stroke: spiccato, length: 0.07, brightness: 0.5, accent: 1.1, players: 5}, volume: -0.5}
  trumpet:            # (the name the pictures read) a men's choir far away in a long hall, two octaves under v6's
                      # trumpet: the hook's cell, very slowly, on ooh at dawn; hummed in the groove; aah in the coda
    instrument: choir
    settings: {vowel: ooh, voices: men, singers: 4, attack: 0.8, brightness: 0.3, vibrato: 10, ring: 1.0}
    reverb: {size: 5.0, mix: 0.45, tone: 4000, predelay: 0.03}
    echo: {delay: 1.5, feedback: 0.3, repeats: 2, pingpong: true}
    volume: 2
    only: [dawn, groove, coda]
    sections:
      dawn:           # A2-F#3: a few basses, slowly, each phrase on one breath
        steps: ". | [pp <] C#3 - - - - - - - - - . . (A2 - - - | C#3 - - - - - - - [mp >] E3 - - - - - - - | C#3 - - - - - - - - - - -) [p] . . . . | [pp <] D3 - - - - - - - - - . . (A2 - - - | D3 - - - - - - - [mp >] F#3 - - - - - - - | D3 - - - - - - - - - - -) [p] . . . . | [p <] (E3 - - - C#3 - - - A2 - - - - - - -) [mp]"
        volume: 8
      groove:         # the hook's first bars hummed far away, second half only (G#2-A3)
        steps: [".", ".", ".", ".", ".", ".", ".", ".",
                "C#3 - . C#3 - . A2 - C#3 - . E3 - . C#3 -", ".", "D3 - . D3 - . A2 - D3 - . F#3 - . D3 -", ".",
                "E3 - . E3 - . C#3 - E3 - . A3 - . E3 -", ".", "B2 - . B2 - . G#2 - B2 - . E3 - . B2 -", "."]
        settings: {vowel: mm, voices: men, singers: 6, attack: 0.07, brightness: 0.25, vibrato: 6, ring: 0.25}
        highpass: 120
        volume: 1
        echo: {delay: 0.75, feedback: 0.3, repeats: 3, pingpong: true}
      coda:           # D, E, then F# major climbing to its third (octave 3: octave 2 would go under the basses' E2)
        octave: 3
        steps: "1 - - - 3 - - - 5 - - - 8 - - - | - - - - - - - - . . . . . . . . | 1 - - - 3 - - - 5 - - - 8 - - - | - - - - - - - - . . . . . . . . | 1 - - - 3 - - - 5 - - - 8 - - - | 8 - - - - - - - 3' - - - - - - - | 3' - - - - - - - - - - - - - - - | - - - - - - - - . . . . . . . ."
        settings: {vowel: aah, voices: men, singers: 8, attack: 0.3, brightness: 0.45, vibrato: 14, ring: 1.5}
        volume: [[0, 2], [6, 2], [8, -5]]
        echo: off
  violins:            # a viola section on the hook, an octave under v6's violins: with the choir in heart2,
                      # under the lead in the climax (two octaves under it)
    instrument: violas
    settings: {attack: 0.1, brightness: 0.35, vibrato: 14, players: 6}
    reverb: {size: 4.0, mix: 0.35, tone: 4500}
    width: 0.7
    pan: -0.1
    only: [heart2, climax]
    steps: &hook12    # the hook an octave under the lead; its legato second bars slurred
      - "C#4 - - C#4 - - A3 - C#4 - - E4 - - C#4 - | (B3 - - - A3 - - - G#3 - - - A3 - - -)"
      - "D4 - - D4 - - A3 - D4 - - F#4 - - D4 - | (C#4 - - - A3 - - - F#3 - - - A3 - - -)"
      - "E4 - - E4 - - C#4 - E4 - - A4 - - E4 - | (C#4 - - - B3 - - - A3 - - - C#4 - - -)"
      - "B3 - - B3 - - G#3 - B3 - - E4 - - B3 - | (G#4 - - - - - - - F#4 - - - E4 - - -)"
    sections:
      heart2: {volume: {from: -4, to: 2}}
      climax:
        steps: &high24  # the climax's melody two octaves under the lead
          - "F#3 - - F#3 - - D3 - F#3 - - A3 - - F#3 - | (E3 - - - D3 - - - C#3 - - - D3 - - -)"
          - "G#3 - - G#3 - - E3 - G#3 - - B3 - - G#3 - | (F#3 - - - E3 - - - D3 - - - E3 - - -)"
          - "A3 - - A3 - - F#3 - A3 - - C#4 - - A3 - | (G#3 - - - F#3 - - - E3 - - - F#3 - - -)"
          - "E3 - - E3 - - C#3 - E3 - - A3 - - E3 - | (C#4 - - - - - - - B3 - - - A3 - - -)"
        settings: {attack: 0.06, brightness: 0.5, vibrato: 12, players: 6}
        duck: {to: kick, depth: 0.25, release: 0.14}
        volume: 3
  swell:              # single viola notes on chord tones in octave 3, each swelling in slowly and dying away
                      # (v6: the string pad an octave higher; v5: music-box glints)
    instrument: violas
    octave: 3
    settings: {attack: 0.6, brightness: 0.25, vibrato: 10, ring: 1.2, players: 5, accent: 0}
    steps: ["5 - - - - - - - . . . 8 - - - -", "- - - . . . 3 - - - - - - - . .", ". . 8 - - - - - - - . . 5 - - -", "- - - - . . . . 3 - - - - - 8 -"]
    pan: 0.15
    width: 0.7
    highpass: 160
    reverb: {size: 4.0, mix: 0.4, tone: 4000}
    volume: 2.5
    only: [dawn, heart, heart2, afterglow, coda]
    sections:
      dawn: {volume: {from: -7.5, to: 0.5}}
      heart: {volume: 0.5}
      heart2: {volume: 2.5}
      coda: {volume: {from: 2.5, to: -4.5}}
  # ------------------------------------------------------------------ the hook
  hook:               # a men's choir, an octave under v6's singing lead (F#3-A4): ooh in the breakdown, opening
                      # to aah in heart2; in the drop and the climax it only doubles the lead underneath
    instrument: choir
    settings: {vowel: aah, voices: men, singers: 10, attack: 0.12, brightness: 0.5, vibrato: 16, ring: 0.5}
    reverb: {size: 4.5, mix: 0.4, tone: 4500, predelay: 0.04}
    echo: {delay: 0.75, feedback: 0.25, repeats: 2, pingpong: true}
    only: [heart, heart2, drop, climax, afterglow, coda]
    steps: *hook12
    sections:
      heart:          # the hook sung slowly: the same notes, the repeated ones tied, each phrase one breath
        steps: &song12
          - "[mp <] (C#4 - - - - - A3 - C#4 - - - E4 - C#4 - | [mf >] B3 - - - A3 - - - G#3 - - - A3 - - -) [mp]"
          - "[mp <] (D4 - - - - - A3 - D4 - - - F#4 - D4 - | [mf >] C#4 - - - A3 - - - F#3 - - - A3 - - -) [mp]"
          - "[mp <] (E4 - - - - - C#4 - E4 - - - A4 - E4 - | [f >] C#4 - - - B3 - - - A3 - - - C#4 - - -) [mp]"
          - "[mp <] (B3 - - - - - G#3 - B3 - - - E4 - B3 - | [f >] G#4 - - - - - - - F#4 - - - E4 - - -) [mp]"
        settings: {vowel: ooh, voices: men, singers: 10, attack: 0.25, brightness: 0.4, vibrato: 18, ring: 0.7, glide: 0.12}
        volume: 4.8
      heart2: {settings: {vowel: aah, voices: men, singers: 12, attack: 0.12, brightness: 0.55, vibrato: 16, ring: 0.5}, volume: 2}
      drop:           # under the lead, an octave down
        settings: {vowel: aah, voices: men, singers: 12, attack: 0.08, brightness: 0.55, vibrato: 12, ring: 0.3}
        duck: {to: kick, depth: 0.3, release: 0.14}
        volume: -6
      climax:         # under the lead, two octaves down
        steps: *high24
        settings: {vowel: aah, voices: men, singers: 12, attack: 0.08, brightness: 0.65, vibrato: 12, ring: 0.3}
        duck: {to: kick, depth: 0.3, release: 0.14}
        volume: -7
      afterglow: {steps: *song12, settings: {vowel: ooh, voices: men, singers: 10, attack: 0.3, brightness: 0.35, vibrato: 18, ring: 0.9, glide: 0.12}, volume: {from: 4.7, to: 1.7}}
      coda:           # F#-A, G#-B, then up the F# major chord to the keynote: ooh opening to aah
        steps: "F#3 | A3 | G#3 | B3 | A#3 | C#4 | F#4 | - - - - - - - - . . . . . . . ."
        settings: {vowel: ooh, morph: aah, voices: men, singers: 10, attack: 0.4, brightness: 0.4, vibrato: 18, ring: 2.0}
        volume: [[0, 1], [6, 1], [8, -7]]
        reverb: {size: 6.0, mix: 0.5, tone: 4500, predelay: 0.04}
  voice:              # the choir's basses an octave under the hook (F#2-A3): the low body (v6: a saw pad)
    instrument: choir
    settings: {vowel: mm, voices: basses, singers: 8, attack: 0.3, brightness: 0.3, vibrato: 10, ring: 0.7}
    reverb: {size: 4.0, mix: 0.35, tone: 3500}
    width: 0.9
    only: [heart, heart2, afterglow, coda]
    steps: *song12
    transpose: -12
    sections:
      heart: {volume: {from: -8, to: -3}}
      heart2: {steps: *hook12, settings: {vowel: ooh, voices: basses, singers: 8, attack: 0.15, brightness: 0.35, vibrato: 10, ring: 0.5}, volume: -2.5}
      afterglow: {volume: {from: -2, to: -6}, settings: {vowel: mm, voices: basses, singers: 8, attack: 0.35, brightness: 0.25, vibrato: 10, ring: 0.9}}
      coda:
        steps: "F#3 | A3 | G#3 | B3 | A#3 | C#4 | F#4 | - - - - - - - - . . . . . . . ."
        settings: {vowel: ooh, voices: basses, singers: 8, attack: 0.5, brightness: 0.3, vibrato: 10, ring: 2.5}
        volume: [[0, -5], [6, -5], [8, -14]]
  horn:               # a slow counter-line in the tenor on a real horn section (v6: a saw pad)
    instrument: horn
    octave: 3
    settings: {players: 4, attack: 0.22, brightness: 0.35, ring: 0.6}
    reverb: {size: 3.5, mix: 0.32, tone: 3000}
    pan: -0.15
    width: 0.6
    volume: 6
    only: [dawn, pulse, heart2, drop, climax]
    steps: &counter
      - "F#3 | E3 - F#3 -"
      - "F#3 | E3 - D3 -"
      - "E3 | E3 - A3 -"
      - "G#3 | B3 - G#3 -"
    sections:
      dawn: {steps: ". | . | . | . | F#3 - A3 - | D4 | E4 - D4 - | A3 - - .", volume: {from: 0, to: 2}, settings: {players: 4, attack: 0.5, brightness: 0.25, ring: 1.2}}
      pulse: {steps: ". | . | . | . | . | . | . | . | C#4 | - | D4 | - | E4 | - | E4 | G#4", volume: [[8, -2], [16, 3]], settings: {players: 4, attack: 0.5, brightness: 0.3, ring: 0.9}}
      heart2: {volume: {from: -2, to: 2}}
      drop: {volume: 3, settings: {players: 4, attack: 0.12, brightness: 0.55, ring: 0.5}, duck: {to: kick, depth: 0.3, release: 0.14}}
      climax: {steps: ["A3 | F#3 - A3 -", "B3 | G#3 - B3 -", "C#4 | A3 - C#4 -", "E4 | C#4 - E4 -"], volume: 4,
               settings: {players: 4, attack: 0.1, brightness: 0.65, ring: 0.5}, duck: {to: kick, depth: 0.3, release: 0.14}}
  lead:               # the supersaw lead of the drop and the climax: the hook at its own pitch (unchanged)
    instrument: supersaw
    settings: {tone: 6000, attack: 0.01, release: 0.25, detune: 30}
    duck: {to: kick, depth: 0.35, release: 0.12}
    width: 1.3
    reverb: {size: 2.2, mix: 0.25}
    only: [drop, climax]
    volume: 4
    steps: &hook
      - "C#5 - - C#5 - - A4 - C#5 - - E5 - - C#5 - | B4 - - - A4 - - - G#4 - - - A4 - - -"
      - "D5 - - D5 - - A4 - D5 - - F#5 - - D5 - | C#5 - - - A4 - - - F#4 - - - A4 - - -"
      - "E5 - - E5 - - C#5 - E5 - - A5 - - E5 - | C#5 - - - B4 - - - A4 - - - C#5 - - -"
      - "B4 - - B4 - - G#4 - B4 - - E5 - - B4 - | G#5 - - - - - - - F#5 - - - E5 - - -"
    sections:
      climax:
        steps: &high
          - "F#5 - - F#5 - - D5 - F#5 - - A5 - - F#5 - | E5 - - - D5 - - - C#5 - - - D5 - - -"
          - "G#5 - - G#5 - - E5 - G#5 - - B5 - - G#5 - | F#5 - - - E5 - - - D5 - - - E5 - - -"
          - "A5 - - A5 - - F#5 - A5 - - C#6 - - A5 - | G#5 - - - F#5 - - - E5 - - - F#5 - - -"
          - "E5 - - E5 - - C#5 - E5 - - A5 - - E5 - | C#6 - - - - - - - B5 - - - A5 - - -"
        volume: 4.5
  # ------------------------------------------------------------------ noises
  riser:
    instrument: riser
    settings: {low: 300, high: 6000}
    only: [pulse, groove, heart2, build, drop]
    volume: 4
    sections:
      pulse: {steps: ". | . | . | . | . | . | . | . | . | . | . | . | . | . | x | -", volume: 5}
      groove: {steps: ". | . | . | . | . | . | . | . | . | . | . | . | . | . | x | -"}
      heart2: {steps: ". | . | . | . | . | . | x | -", volume: 1, settings: {low: 200, high: 2500}}
      build: {steps: ". | . | . | . | x | - | - | - - - - - . . .", volume: 8}
      drop: {steps: ". | . | . | . | . | . | . | . | . | . | . | . | . | . | x | -", volume: 6}
  static:
    instrument: static
    only: [dawn, heart]
    steps: "x | - | - | - | - | - | - | -"
    width: 1.6
    volume: -2
    sections:
      dawn: {volume: -6}

      lift:   {settings: {attack: 0.1, vibrato: 14}, steps: "[f <] (F#5 - - - A5 - D6 - | E6 - - - - - - -) [ff]"}
      summit: {settings: {attack: 0.1}, steps: "[ff] D#6+F#6 - - - - - - - | D#6+G#6 - - - - - - - | B5+E6 - - - - - - - | C#6+F#6 - - - - - - -"}

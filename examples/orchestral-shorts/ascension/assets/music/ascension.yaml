# Ascension: an original 33.6 s cue for vidgen's orchestra. No samples, no SoundFont.
# 100 BPM, A major rising to B major; one bar = 2.4 s = 72 frames at 30 fps.
#   spark   2  the first frame: horns, timpani and a crash on A; then plucked strings ticking like a clock
#   climb   4  the spiccato engine, four horns sing the heroic theme, the choir on "ooh"
#   lift    2  the violins carry the theme up, taikos build, a snare roll and a cymbal swell into...
#   summit  4  a step up to B major: the trumpets' theme over the whole orchestra and the choir on "aah"
#   end     2  E to B (amen), tam-tam
version: 1
title: Ascension
key: A major
tempo: 100
seed: 6035
loop: false
sections:
  - {name: spark, bars: 2, progression: "A F#m"}
  - {name: climb, bars: 4, progression: "D A E F#m"}
  - {name: lift, bars: 2, progression: "D E"}
  - {name: summit, bars: 4, progression: "B G#m E F#"}
  - {name: end, bars: 2, progression: "E B"}

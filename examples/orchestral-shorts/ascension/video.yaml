# Ascension: a portrait orchestral music video.
# Music: assets/music/ascension.yaml, an original score for vidgen's own orchestra (100.0 BPM, A major; one bar = 2.4000 s).
# Pictures: ../shared/orch.js (vidgen/three-kit, music-time, three-finish, title-cards), one web_cut shot per 1-2 bars.
# Written by ../tools/gen.py from shots.yaml.

# First Light: a portrait orchestral music video.
# Music: assets/music/first_light.yaml, an original score for vidgen's own orchestra (96.0 BPM, D major; one bar = 2.5000 s).
# Pictures: ../shared/orch.js (vidgen/three-kit, music-time, three-finish, title-cards), one web_cut shot per 1-2 bars.
# Written by ../tools/gen.py from shots.yaml.
title: First Light
output: first_light
format: {width: 1080, height: 1920, fps: 30}
preview: {width: 360, height: 640, fps: 30}
theme: {preset: dark_tech}
transition: cut
render: {intermediate: compact, keep_intermediates: false}
music: {source: first_light, volume: 0, start: 0, loop: false, fade_in: 0, fade_out: 1.5, duck: false}
audio: {normalize: true, target_lufs: -14, true_peak: -1.5, bitrate: 256k}
extensions: [../shared]
web_root: ..
scenes:
- id: 01_drift
  type: web_cut
  duration: 5.0
  params:
    script: ../shared/orch.js
    data:
      mode: drift
      seed: 100
      colours: {base: '#ffb36b', accent: '#8fd0ff', deep: '#07050b'}
      react:
        pulse: [taiko, timpani]
        glint: [horns]
        glow: [choir]
      grade: {temperature: -0.15, saturation: 0.95}
      lookY: -38
      title: {title: FIRST LIGHT, subtitle: an orchestral short, made: true, hold: 3.4}
      note: bars 1-2 (dawn, intro)
    music_data: &id001
      tracks: [bass_drum, choir, crash, gong, horns, snares, taiko, timpani, trumpet, violins]

# Gate of Stars: an original 30 s cue for vidgen's orchestra. No samples, no SoundFont.
# 80 BPM in Eb major; one bar = 3 s = 90 frames at 30 fps.
#   gate        2  the first frame: a cathedral organ chord, the choir on "aah", timpani and a tam-tam;
#                  violins in tremolo high above
#   procession  3  four horns in a chorale, plucked basses walking, the sopranos sing the melody on "la"
#   rise        1  a timpani roll, a snare roll and a cymbal swell, the strings growing into...
#   open        3  the gate opens: the trumpets' melody over the full organ, brass, choir and taikos
#   end         1  Eb major, tam-tam, the organ's last chord
version: 1
title: Gate of Stars
key: Eb major
tempo: 80
seed: 4813
loop: false
sections:
  - {name: gate, bars: 2, progression: "Eb Cm"}
  - {name: procession, bars: 3, progression: "Ab Bb Gm"}
  - {name: rise, bars: 1, progression: "Bb"}
  - {name: open, bars: 3, progression: "Eb Ab Bb"}
  - {name: end, bars: 1, progression: "Eb"}
tracks:
  organ:
    instrument: organ
    settings: {registration: cathedral}
    volume: -3
    reverb: {size: 5, mix: 0.4, tone: 4200}
    sections:
      gate:       {steps: "Eb3+G3+Bb3+Eb4 - - - - - - - | C3+G3+C4+Eb4 - - - - - - -"}
      procession: {settings: {registration: principal}, steps: "Ab2+Eb3+Ab3+C4 - - - - - - - | Bb2+F3+Bb3+D4 - - - - - - - | G2+D3+G3+Bb3 - - - - - - -"}
      rise:       {settings: {registration: principal}, steps: "Bb2+F3+Bb3+D4 - - - - - - -"}
      open:       {settings: {registration: full}, steps: "Eb3+G3+Bb3+Eb4 - - - - - - - | Ab2+Eb3+Ab3+C4 - - - - - - - | Bb2+F3+Bb3+D4 - - - - - - -"}
      end:        {settings: {registration: full}, steps: "Eb3+G3+Bb3+Eb4 - - - - - . . ."}
  pedal:
    instrument: organ
    octave: 1
    settings: {drawbars: "86 8400 000"}
    volume: -4
    reverb: {size: 5, mix: 0.4, tone: 3000}
    steps: "x - - - - - - -"
    sections:
      end: {steps: "x - - - - - . ."}
  violins:
    instrument: violins
    pan: -0.4
    reverb: {size: 4.2, mix: 0.34, tone: 4800}
    sections:
      gate:       {settings: {stroke: tremolo, brightness: 0.7, attack: 0.08}, steps: "[f >] Bb5+Eb6 - - - - - - - | [mf] G5+C6 - - - - - - -"}
      procession: {settings: {attack: 0.2}, steps: "[mp] Eb5+Ab5 - - - - - - - | F5+Bb5 - - - - - - - | D5+G5 - - - - - - -"}
      rise:       {settings: {stroke: tremolo, brightness: 0.8}, steps: "[mp <] D5+F5 - - - - - - - [ff]"}
      open:       {settings: {attack: 0.1}, steps: "[ff] G5+Bb5 - - - - - - - | Ab5+C6 - - - - - - - | F5+Bb5 - - - - - - -"}
      end:        {steps: "[ff >] G5+Bb5 - - - - - . . [mp]"}
  cellos:
    instrument: cellos
    pan: 0.25

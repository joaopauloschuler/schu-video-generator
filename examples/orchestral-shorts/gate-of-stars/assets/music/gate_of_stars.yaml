    sections:
      gate:       {steps: "[ff] Eb2+Bb2 - - - - - - - | [mf] C2+G2 - - - - - - -"}
      procession: {steps: "[mp] Ab1+Eb2 - - - - - - - | Bb1+F2 - - - - - - - | G1+D2 - - - - - - -"}
      rise:       {settings: {attack: 2.4, brightness: 1.0}, steps: "[pp <] Bb1+F2 - - - - - - - [ff]"}
      open:       {steps: "[ff] Eb2+Bb2 - - - - - - - | Ab1+Eb2 - - - - - - - | Bb1+F2 - - - - - - -"}

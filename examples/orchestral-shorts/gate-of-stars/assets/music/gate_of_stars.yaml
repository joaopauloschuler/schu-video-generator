      procession: {steps: "[mf] (Ab2 - - - C3 - Eb3 - | Bb2 - - - D3 - F3 - | G2 - - - Bb2 - D3 -)"}
      rise:       {settings: {stroke: tremolo}, steps: "[mp <] Bb2 - - - - - - - [ff]"}
      open:       {settings: {stroke: spiccato}, accent: "3+3+2", steps: "[ff] Eb3 Eb3 Bb3 Eb3 G3 Eb3 Bb3 Eb3 Eb3 Eb3 Bb3 Eb3 G3 Eb3 Bb3 Eb3 | Ab2 Ab2 Eb3 Ab2 C3 Ab2 Eb3 Ab2 Ab2 Ab2 Eb3 Ab2 C3 Ab2 Eb3 Ab2 | Bb2 Bb2 F3 Bb2 D3 Bb2 F3 Bb2 Bb2 Bb2 F3 Bb2 D3 Bb2 F3 Bb2"}

# Orchestra Test: a portrait orchestral music video.
# Music: assets/music/orchestra_test.yaml, an original score for vidgen's own orchestra (90.0 BPM, D minor; one bar = 2.6667 s).
# Pictures: ../shared/orch.js (vidgen/three-kit, music-time, three-finish, title-cards), one web_cut shot per 1-2 bars.
# Written by ../tools/gen.py from shots.yaml.
title: Orchestra Test
output: orchestra_test
format: {width: 1080, height: 1920, fps: 30}
preview: {width: 360, height: 640, fps: 30}
theme: {preset: dark_tech}
transition: cut
render: {intermediate: compact, keep_intermediates: false}
music: {source: orchestra_test, volume: 0, start: 0, loop: false, fade_in: 0, fade_out: 1.5, duck: false}
audio: {normalize: true, target_lufs: -14, true_peak: -1.5, bitrate: 256k}
extensions: [../shared]
web_root: ..
scenes:
- id: 01_crystal
  type: web_cut
  duration: 5.3333333
  params:
    script: ../shared/orch.js
    data:
      mode: crystal
      seed: 100
      colours: {base: '#477bba', accent: '#d98d78', deep: '#070b10'}
      react:
        pulse: [gong]
        glow: [violins]
      grade: {temperature: -0.15, saturation: 0.95}
      kind: octa
      label: [Strings, 'violins + violas: tremolo', 'cellos + basses: swell']
      note: bars 1-2 (strings, intro)
    music_data: &id001
      tracks: [bass_drum, cellos, crash, gong, horns, men, taiko, timpani, violins, women]
- id: 02_tunnel

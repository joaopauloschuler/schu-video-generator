# Eclipse: an original 32 s cue for vidgen's orchestra. No samples, no SoundFont.
# 90 BPM, F minor turning to F major; one bar = 2.667 s = 80 frames at 30 fps.
#   shadow    2  the first frame: low brass, taikos, a bass drum and the tam-tam; a low spiccato ostinato and a
#                reed organ pedal
#   totality  2  the women whisper, the men hum, violins in a glassy tremolo near the bridge, timpani
#   corona    4  the horns' theme, the trumpet answering, the choir on "ooh", the full string engine
#   dawn      2  a timpani roll, a snare roll and a cymbal swell into...
#   sunrise   2  F major: the whole orchestra, the choir on "aah", crash and tam-tam
version: 1
title: Eclipse
key: F minor
tempo: 90
seed: 7146
loop: false
sections:
  - {name: shadow, bars: 2, progression: "Fm Db"}
  - {name: totality, bars: 2, progression: "Bbm C"}
  - {name: corona, bars: 4, progression: "Fm Db Ab C"}
  - {name: dawn, bars: 2, progression: "Db Eb"}
  - {name: sunrise, bars: 2, progression: "F F"}
tracks:
  organ:
    instrument: organ
    only: [shadow, totality, sunrise]
    volume: -6
    reverb: {size: 5, mix: 0.4, tone: 3000}
    sections:
      shadow:   {settings: {registration: reed}, octave: 1, steps: "F1+C2 - - - - - - - | Db1+Ab1 - - - - - - -"}
      totality: {settings: {registration: flute}, steps: "Bb2+F3+Db4 - - - - - - - | C3+G3+E4 - - - - - - -"}
      sunrise:  {settings: {registration: full}, steps: "F2+C3+F3+A3+C4 - - - - - - - | - - - - - - . ."}
  violins:
    instrument: violins
    pan: -0.4
    reverb: {size: 4, mix: 0.32, tone: 4500}
    sections:
      shadow:   {settings: {stroke: spiccato}, steps: ". | [mp] F4 Ab4 C5 Ab4 F4 Ab4 C5 Ab4 F4 Ab4 Db5 Ab4 F4 Ab4 Db5 Ab4"}
      totality: {settings: {stroke: tremolo, brightness: 1.0, attack: 0.3}, steps: "[mp] Db6+F6 - - - - - - - | [<] E6+G6 - - - - - - - [f]"}
      corona:   {settings: {stroke: spiccato}, accent: "3+3+2", steps: "[mf] F5 Ab5 C6 F5 Ab5 C6 Ab5 F5 F5 Ab5 C6 F5 Ab5 C6 Ab5 F5 | F5 Ab5 Db6 F5 Ab5 Db6 Ab5 F5 F5 Ab5 Db6 F5 Ab5 Db6 Ab5 F5 | Eb5 Ab5 C6 Eb5 Ab5 C6 Ab5 Eb5 Eb5 Ab5 C6 Eb5 Ab5 C6 Ab5 Eb5 | E5 G5 C6 E5 G5 C6 G5 E5 E5 G5 C6 E5 G5 C6 G5 E5"}
      dawn:     {settings: {attack: 0.1}, steps: "[f <] (Ab5 - - - F5 - Db6 - | Bb5 - - - G5 - Eb6 -) [ff]"}
      sunrise:  {settings: {attack: 0.08, vibrato: 14}, steps: "[ff] (F6 - - - E6 - C6 - | A5 - - - - -) . ."}

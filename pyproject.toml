[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schu-video-generator"
version = "0.3.0"
description = "Configurable generator for narrated animated videos (Manim + ElevenLabs + ffmpeg)"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19",
    "pydantic>=2.7",
    "pyyaml",
    "av",
    # PDF slide decks (vidgen slides --format pdf).
    "fpdf2>=2.7.9",
    # Local speech to text (vidgen readback).
    "faster-whisper>=1.0",
    # The MCP server for AI agents (vidgen mcp).
    "mcp>=1.19",
    # Kokoro narration on this computer. kokoro 0.9.4 (and misaki) declare Python < 3.13; on 3.13
    # the marker leaves it out and `vidgen tts` explains (DESIGN.md §68).
    "kokoro>=0.9.4; python_version < '3.13'",
    # Kokoro's Mandarin voices (pure Python). Japanese (misaki[ja]) is left out: its pyopenjtalk
    # has no wheels, so it would make every install need a C++ compiler (DESIGN.md §68).
    "misaki[zh]>=0.9.4; python_version < '3.13'",
    # composed music (Phase N): 0.6.0's SoundFont render is broken, so the pin is exact.
    "symusic==0.5.9",
    # 3D scenes (Phase AI): three.js in headless Chromium; vidgen's error message gives the
    # command that downloads the browser (`python -m playwright install chromium`).
    "playwright>=1.40",
]

[project.optional-dependencies]
# Every package a user needs is in `dependencies`. These names stay, empty, so that older install
# commands such as `pip install "schu-video-generator[3d]"` still work without a warning.
pdf = []
stt = []
mcp = []
kokoro = []
music = []
3d = []
dev = ["pytest", "jsonschema>=4.18", "pytest-xdist", "fpdf2>=2.7.9", "pypdf>=4", "mcp>=1.19"]

[project.scripts]
vidgen = "vidgen.cli:main"
vidgen-mcp = "vidgen.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vidgen = ["templates/**/*", "data/fonts/**/*", "data/icons/**/*", "data/geo/*", "data/slides/*", "data/guide/*", "data/gallery/**/*","data/openrouter/*", "data/three/*", "data/kokoro/*", "data/sets/*", "data/pronunciation/*", "studio/beds/*.yaml", "studio/data/*", "studio_app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: invokes Manim rendering (slow; deselect with -m \"not render\")",
    "slow: the slowest render tests, several seconds each (quick run: -m \"not slow\")",
    "ui: browser tests of vidgen studio's page (headless Chromium through Playwright; skipped without it)",
]
